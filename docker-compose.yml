services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      MOCK_AI: ${MOCK_AI:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

